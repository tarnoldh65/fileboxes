[package]
name = "fileboxes"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
dioxus = "0.7.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.1", features = ["v4", "serde", "js"] }

[dev-dependencies]
dioxus-ssr = "0.7.10"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]
