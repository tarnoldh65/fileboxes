[package]
name = "fileboxes"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
ammonia = "4.2.4"
base64 = "0.23.1"
dioxus = "0.7.10"
futures-timer = "3.0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.1", features = ["v4", "serde", "js"] }
zip = { version = "9.4.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "7.0.0"
open = "5.4.5"
pollster = "1.0.1"
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { version = "3.0.4", features = ["wasm-bindgen"] }
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = [
    "File",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemRemoveOptions",
    "FileSystemWritableFileStream",
    "Navigator",
    "StorageManager",
    "Window",
    "WritableStream",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
dioxus-ssr = "0.7.10"
pollster = "1.0.1"
tempfile = "3.27.0"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.80"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]
