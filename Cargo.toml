[package]
name = "fileboxes"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
dioxus = "0.7.10"
futures-timer = "3.0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.1", features = ["v4", "serde", "js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "7.0.0"
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { version = "3.0.4", features = ["wasm-bindgen"] }

[dev-dependencies]
dioxus-ssr = "0.7.10"
pollster = "1.0.1"
tempfile = "3.27.0"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]
